[project]
name = "videosearch-backend"
version = "0.1.0"
description = "VideoSearch local FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0"
]

[tool.uv]
package = false

[dependency-groups]
build = [
    "pyinstaller>=6.0.0",
]

